name: MCP Security Audit

on:
  push:
    paths:
      - '**/*manifest*.json'
      - '**/*manifest*.yaml'
      - '**/claude_desktop_config.json'
      - '**/mcp*.json'
  pull_request:
    paths:
      - '**/*manifest*.json'
      - '**/*manifest*.yaml'
      - '**/claude_desktop_config.json'
      - '**/mcp*.json'

jobs:
  audit-mcp-manifests:
    name: Audit MCP Manifest Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ScourMCP
        run: npm install -g @scourmcp/backend

      - name: Audit Manifests with Security Gate
        run: |
          echo "🔍 Scanning MCP tool definitions for shell execution, prompt injection, and over-permissions..."
          # Scan config and fail the check if any HIGH or CRITICAL severity findings are detected
          npx scourmcp scan ./claude_desktop_config.json --fail-on=high --format=table

      - name: Compare Baseline vs PR for Permission Escalations
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:./claude_desktop_config.json > /tmp/base_manifest.json || true
          if [ -f /tmp/base_manifest.json ]; then
            echo "🔀 Running Permission Diff against baseline..."
            npx scourmcp diff /tmp/base_manifest.json ./claude_desktop_config.json
          fi
